-- Users
create table users (

  national_id varchar(14) unique not null,
  password_hash text not null,
  role text check (role in ('admin','reception','cashier','security','accounts','member')),
  name text not null, phone varchar(15),
  created_at timestamp default now()
);

-- Members
create table members (
  id text primary key, -- BREEZE-XXXX
  national_id varchar(14) unique not null,
  name text not null, phone varchar(15),
  face_image_url text, status text,
  membership_type text, join_date date, expiry_date date,
  total_visits int default 0,
  discount int default 0,
  created_at timestamp default now()
);

-- Family
create table family_members (
  id uuid primary key default uuid_generate_v4(),
  member_id text references members(id) on delete cascade,
  name text, relation text, age text
);

-- Services & Pricing
create table services (id text primary key, name_ar text, name_en text, price_member int, price_non_member int, category text);
create table pricing (id text primary key, name text, duration text, price int, family_price int);

-- Transactions
create table transactions (
  id text primary key, member_id text references members(id),
  member_name text, type text, amount int, discount int, final_amount int,
  payment_method text, date date, time text, status text, comment text, cashier_id uuid references users(id), is_non_member boolean default false
);

-- Entry Logs (Face ID)
create table entry_logs (
  id text primary key, member_id text references members(id),
  member_name text, timestamp timestamptz default now(), date text, time text
);

-- News
create table news (id text primary key, title text, content text, date text, pinned boolean default false);

-- RLS Policies
alter table members enable row level security;
create policy "Allow all for authenticated" on members for all using (true);
-- Repeat for other tables...

insert into storage.buckets (id, name, public) values ('faces','faces', true);
